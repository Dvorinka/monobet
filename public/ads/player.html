<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sponsored</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: clamp(20px, 5vw, 48px); }
  .stage.left { align-items: flex-start; text-align: left; padding-left: clamp(28px, 8vw, 80px); }
  .stage.left h1 { margin-left: 0; }
  .stage.left .mark { margin-left: 0; margin-bottom: 18px; }
  .glow { position: absolute; inset: -40%; filter: blur(60px); opacity: .55;
    animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(-6%, -4%) scale(1); } to { transform: translate(6%, 4%) scale(1.12); } }
  .grain { position: absolute; inset: 0; opacity: .07;
    background-image: repeating-linear-gradient(0deg, transparent 0 2px, #000 2px 3px); }
  .ghost { position: absolute; right: -2%; bottom: -14%; font-size: clamp(160px, 34vw, 340px);
    font-weight: 900; line-height: 1; opacity: .07; user-select: none; pointer-events: none; }
  .stage.center .ghost { display: none; }
  .mark { position: relative; width: clamp(64px, 9vw, 96px); height: clamp(64px, 9vw, 96px); border-radius: 24px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 26px;
    font-size: clamp(34px, 5vw, 50px); font-weight: 800; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    animation: pop .7s cubic-bezier(.2, 1.4, .3, 1) both .15s, bob 4s ease-in-out .9s infinite; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
  h1 { position: relative; font-size: clamp(30px, 6vw, 58px); font-weight: 800; letter-spacing: -.03em;
    line-height: 1.04; max-width: 15em; animation: rise .8s cubic-bezier(.2,.9,.3,1) both .5s; }
  p.sub { position: relative; margin-top: 14px; font-size: clamp(14px, 2.4vw, 20px); font-weight: 500;
    opacity: .85; max-width: 32em; animation: rise .8s cubic-bezier(.2,.9,.3,1) both .85s; }
  .cta { position: relative; margin-top: 30px; padding: 13px 30px; border-radius: 999px;
    font-size: clamp(14px, 2vw, 17px); font-weight: 700; letter-spacing: .01em; background: #fff; color: #111;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    animation: rise .8s cubic-bezier(.2,.9,.3,1) both 1.2s, pulse 2.2s ease-in-out 2.4s infinite; }
  @keyframes rise { from { transform: translateY(26px); opacity: 0; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .badge { position: absolute; top: 14px; right: 16px; font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-radius: 6px;
    background: rgba(0,0,0,.4); color: rgba(255,255,255,.75); backdrop-filter: blur(4px); }
  .bubbles i { position: absolute; bottom: -60px; border-radius: 50%;
    background: rgba(255,255,255,.14); animation: float linear infinite; }
  @keyframes float { to { transform: translateY(-130vh); } }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video>
<div class="stage" id="s" style="display:none">
  <div class="glow" id="glow"></div>
  <div class="grain"></div>
  <div class="ghost" id="ghost"></div>
  <div class="mark" id="mark"></div>
  <h1 id="h"></h1>
  <p class="sub" id="sub"></p>
  <div class="cta" id="cta"></div>
  <div class="bubbles" id="b"></div>
</div>
<div class="badge" style="z-index:2">Sponsored</div>
<script>
// Self-contained ad creatives — two for MonoBet itself, the rest fictional
// sponsors. "layout: left" swaps the centered composition for an editorial
// left-aligned one with a ghost watermark glyph. ?i=<n> pins a creative.
const ADS = [
  { layout: "center", bg: ["#06120c", "#0d2f1e"], glow: "#0f9d58", mark: "#0f9d58", markColor: "#06120c", glyph: "M",
    h: "Bet on anything. Prove everyone wrong.", sub: "MonoBet — play-money prediction markets. Make markets, trade outcomes, climb the board.", cta: "Start predicting" },
  { layout: "left", bg: ["#0a0f0c", "#123324"], glow: "#22c55e", mark: "#e7f5ec", markColor: "#0a0f0c", glyph: "Ɱ",
    h: "Ɱ isn't real money. Your takes are.", sub: "Daily faucet, weekly drops, zero risk — all the conviction, none of the credit card debt.", cta: "Claim free Marks" },
  { layout: "center", bg: ["#1a1400", "#3d2e00"], glow: "#f5c518", mark: "#f5c518", markColor: "#1a1400", glyph: "⚡",
    h: "VOLT COLA", sub: "400% of your daily voltage. Now in Thunderberry. Do not exceed one per reality.", cta: "Feel the hum" },
  { layout: "left", bg: ["#0c0618", "#241040"], glow: "#8b5cf6", mark: "#2a1450", markColor: "#c4b5fd", glyph: "✦",
    h: "STARFORGE", sub: "Forge a fleet. Burn a galaxy. The hit space sim — season 3: The Ashen Armada is live.", cta: "Launch now" },
  { layout: "center", bg: ["#160800", "#3d1a00"], glow: "#f97316", mark: "#f97316", markColor: "#160800", glyph: "◮",
    h: "AeroStride Vapor 9", sub: "Carbon plate. Zero gravity energy return. Your knees will file a thank-you note.", cta: "Run faster" },
  { layout: "left", bg: ["#170e05", "#3a2410"], glow: "#b45309", mark: "#92400e", markColor: "#fde68a", glyph: "☕",
    h: "Dusk Roast", sub: "Single-origin beans roasted at twilight, for reasons that are mostly vibes.", cta: "Brew better" },
  { layout: "center", bg: ["#040d1a", "#0b2b4d"], glow: "#38bdf8", mark: "#38bdf8", markColor: "#040d1a", glyph: "◉",
    h: "FocusPilot", sub: "The app that closes your other apps. Ruthless productivity, delivered gently.", cta: "Get focused" },
  { layout: "left", bg: ["#020617", "#0f1f33"], glow: "#2dd4bf", mark: "#134e4a", markColor: "#99f6e4", glyph: "◐",
    h: "Night Harbor", sub: "A detective. A lighthouse. A town that remembers. Streaming exclusively on StreamPlus.", cta: "Watch ep. 1 free" },
  { layout: "center", bg: ["#12001f", "#2d0a4d"], glow: "#c084fc", mark: "#7e22ce", markColor: "#f3e8ff", glyph: "Q",
    h: "Quill Browser", sub: "Tabs that organize themselves. Tracking that doesn't exist. Browse like it's 2007 again.", cta: "Download Quill" },
  { layout: "left", bg: ["#060b02", "#16290a"], glow: "#a3e635", mark: "#365314", markColor: "#d9f99d", glyph: "N",
    h: "NovaCard", sub: "The card that rounds up your dreams. 2% cashback, 100% drip.", cta: "Apply in 60s" },
  { layout: "center", bg: ["#1a0505", "#3d0a0a"], glow: "#ef4444", mark: "#7f1d1d", markColor: "#fecaca", glyph: "🔥",
    h: "Inferno Wheels", sub: "Dice carved from volcanic glass. Each roll leaves a scorch mark on probability itself.", cta: "Roll hot" },
  { layout: "left", bg: ["#0a0a14", "#1b1b3a"], glow: "#818cf8", mark: "#312e81", markColor: "#c7d2fe", glyph: "☾",
    h: "SleepWire", sub: "Earbuds that play your dreams back to you in the morning. Side effects include remembering them.", cta: "Sleep smarter" },
  { layout: "center", bg: ["#0d0202", "#290505"], glow: "#f43f5e", mark: "#881337", markColor: "#fda4af", glyph: "♦",
    h: "Crimson Table", sub: "Private poker nights, minus the poker faces. Table stakes are vibes; fold is a lifestyle.", cta: "Take a seat" },
  { layout: "left", bg: ["#02120e", "#062a22"], glow: "#2dd4bf", mark: "#0f766e", markColor: "#99f6e4", glyph: "~",
    h: "Tidepool.fm", sub: "Ocean sounds engineered by retired submarine sonar operators. Certification: very wet.", cta: "Dive in" },
  { layout: "center", bg: ["#110d00", "#332600"], glow: "#fbbf24", mark: "#a16207", markColor: "#fef3c7", glyph: "◈",
    h: "Honeywire", sub: "The messaging app where every message is exactly seven words. No more, no less. Bee-lieve it.", cta: "Buzz now" },
  { layout: "left", bg: ["#120818", "#2a1230"], glow: "#e879f9", mark: "#701a75", markColor: "#fae8ff", glyph: "♥",
    h: "SecondDate", sub: "Meet people who also bought YES at 12%. Shared delusion is the strongest foundation.", cta: "Match delusions" },
  { layout: "center", bg: ["#0d0d0f", "#232330"], glow: "#94a3b8", mark: "#334155", markColor: "#e2e8f0", glyph: "▣",
    h: "IronVault Bank", sub: "Your money sleeps in a vault. Our interest rates sleep even deeper.", cta: "Open a vault" },
  { layout: "left", bg: ["#030f14", "#0a2a33"], glow: "#22d3ee", mark: "#155e75", markColor: "#cffafe", glyph: "✈",
    h: "CloudCouch Air", sub: "Legroom sold separately. Turbulence included at no extra charge.", cta: "Fly upright" },
  { layout: "center", bg: ["#0d0500", "#2b1200"], glow: "#fb923c", mark: "#9a3412", markColor: "#ffedd5", glyph: "◉",
    h: "HexFlakes", sub: "The cereal with six sides per flake and zero regrets per bowl. Part of a suspiciously complete breakfast.", cta: "Pour a bowl" },
  { layout: "left", bg: ["#070d04", "#15240c"], glow: "#4ade80", mark: "#166534", markColor: "#dcfce7", glyph: "❋",
    h: "Meadow Lane", sub: "The farming sim where your crops bet on rain. Harvest profits — or harvest lessons.", cta: "Plant a take" },
];
// Rendered MP4 creatives (generated, ~20s each, muted). Video plays via
// shuffle-bag; any failure falls back to a CSS creative from ADS.
const VIDEOS = 18;
const params = new URLSearchParams(location.search);
const vEl = document.getElementById("v");
const sEl = document.getElementById("s");

// Shuffle-bag: every item plays once before any repeats, and a refill never
// opens with the item that just closed the last bag.
function pick(bagKey, lastKey, n) {
  try {
    const last = Number(localStorage.getItem(lastKey));
    let bag = (JSON.parse(localStorage.getItem(bagKey) || "[]") || [])
      .filter((x) => Number.isInteger(x) && x >= 0 && x < n);
    if (!bag.length) {
      bag = Array.from({ length: n }, (_, k) => k);
      for (let k = bag.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [bag[k], bag[j]] = [bag[j], bag[k]];
      }
      if (bag.length > 1 && bag[bag.length - 1] === last) {
        const j = bag.findIndex((x) => x !== last);
        [bag[j], bag[bag.length - 1]] = [bag[bag.length - 1], bag[j]];
      }
    }
    const x = bag.pop();
    localStorage.setItem(bagKey, JSON.stringify(bag));
    localStorage.setItem(lastKey, String(x));
    return x;
  } catch {
    return Math.floor(Math.random() * n);
  }
}

function renderHtmlAd() {
  sEl.style.display = "";
  vEl.style.display = "none";
  vEl.removeAttribute("src");
  let i = Number(params.get("i"));
  if (!Number.isInteger(i) || i < 0 || i >= ADS.length) i = pick("mb.adBag", "mb.adLast", ADS.length);
  const ad = ADS[i];
  const s = sEl;
  s.classList.add(ad.layout === "left" ? "left" : "center");
  s.style.background = `radial-gradient(120% 120% at 50% 0%, ${ad.bg[1]} 0%, ${ad.bg[0]} 70%)`;
  const glow = document.getElementById("glow");
  glow.style.background = `radial-gradient(50% 50% at 30% 30%, ${ad.glow}55, transparent 60%), radial-gradient(45% 45% at 75% 70%, ${ad.glow}33, transparent 60%)`;
  const mark = document.getElementById("mark");
  mark.style.background = ad.mark; mark.style.color = ad.markColor; mark.textContent = ad.glyph;
  document.getElementById("ghost").textContent = ad.glyph;
  document.getElementById("h").textContent = ad.h;
  document.getElementById("sub").textContent = ad.sub;
  const cta = document.getElementById("cta");
  cta.textContent = ad.cta; cta.style.boxShadow = `0 10px 30px ${ad.glow}66`;
  const b = document.getElementById("b");
  for (let k = 0; k < 14; k++) {
    const e = document.createElement("i");
    const sz = 4 + Math.random() * 10;
    e.style.cssText = `left:${Math.random() * 100}%;width:${sz}px;height:${sz}px;animation-duration:${5 + Math.random() * 7}s;animation-delay:${-Math.random() * 10}s;opacity:${.3 + Math.random() * .5}`;
    b.appendChild(e);
  }
}

let fell = false;
const fallback = () => { if (!fell) { fell = true; renderHtmlAd(); } };
vEl.addEventListener("error", fallback);
if (params.get("i") !== null) {
  fallback(); // ?i= pins a CSS creative
} else {
  let vi = Number(params.get("v"));
  if (!Number.isInteger(vi) || vi < 0 || vi >= VIDEOS) vi = pick("mb.vidBag", "mb.vidLast", VIDEOS);
  const kick = setTimeout(fallback, 5000);
  vEl.addEventListener("canplay", () => {
    clearTimeout(kick);
    vEl.style.display = "block";
    vEl.play().catch(fallback);
  }, { once: true });
  vEl.src = `/ads/ad-${vi}.mp4`;
}
</script>
</body>
</html>
