<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sponsored</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; }
  .glow { position: absolute; inset: -40%; filter: blur(60px); opacity: .55;
    animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(-6%, -4%) scale(1); } to { transform: translate(6%, 4%) scale(1.12); } }
  .grain { position: absolute; inset: 0; opacity: .07;
    background-image: repeating-linear-gradient(0deg, transparent 0 2px, #000 2px 3px); }
  .mark { position: relative; width: 74px; height: 74px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
    font-size: 38px; font-weight: 800; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    animation: pop .7s cubic-bezier(.2, 1.4, .3, 1) both .15s, bob 4s ease-in-out .9s infinite; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
  h1 { position: relative; font-size: clamp(26px, 7vw, 44px); font-weight: 800; letter-spacing: -.03em;
    line-height: 1.05; max-width: 14em; animation: rise .8s cubic-bezier(.2,.9,.3,1) both .5s; }
  p.sub { position: relative; margin-top: 12px; font-size: clamp(13px, 3vw, 17px); font-weight: 500;
    opacity: .85; max-width: 30em; animation: rise .8s cubic-bezier(.2,.9,.3,1) both .85s; }
  .cta { position: relative; margin-top: 26px; padding: 11px 26px; border-radius: 999px;
    font-size: 14.5px; font-weight: 700; letter-spacing: .01em; background: #fff; color: #111;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    animation: rise .8s cubic-bezier(.2,.9,.3,1) both 1.2s, pulse 2.2s ease-in-out 2.4s infinite; }
  @keyframes rise { from { transform: translateY(26px); opacity: 0; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .badge { position: absolute; top: 12px; right: 14px; font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; padding: 4px 9px; border-radius: 6px;
    background: rgba(0,0,0,.4); color: rgba(255,255,255,.75); backdrop-filter: blur(4px); }
  .bubbles i { position: absolute; bottom: -60px; border-radius: 50%;
    background: rgba(255,255,255,.14); animation: float linear infinite; }
  @keyframes float { to { transform: translateY(-130vh); } }
</style>
</head>
<body>
<div class="stage" id="s">
  <div class="glow" id="glow"></div>
  <div class="grain"></div>
  <div class="mark" id="mark"></div>
  <h1 id="h"></h1>
  <p class="sub" id="sub"></p>
  <div class="cta" id="cta"></div>
  <div class="bubbles" id="b"></div>
  <div class="badge">Sponsored</div>
</div>
<script>
// Ten self-contained ad creatives — two for MonoBet itself, the rest
// fictional sponsors. Picked at random or via ?i=<0-9> for testing.
const ADS = [
  { bg: ["#06120c", "#0d2f1e"], glow: "#0f9d58", mark: "#0f9d58", markColor: "#06120c", glyph: "M",
    h: "Bet on anything. Prove everyone wrong.", sub: "MonoBet — play-money prediction markets. Make markets, trade outcomes, climb the board.", cta: "Start predicting" },
  { bg: ["#0a0f0c", "#123324"], glow: "#22c55e", mark: "#e7f5ec", markColor: "#0a0f0c", glyph: "Ɱ",
    h: "Ɱ isn't real money. Your takes are.", sub: "Daily faucet, weekly drops, zero risk — all the conviction, none of the credit card debt.", cta: "Claim free Marks" },
  { bg: ["#1a1400", "#3d2e00"], glow: "#f5c518", mark: "#f5c518", markColor: "#1a1400", glyph: "⚡",
    h: "VOLT COLA", sub: "400% of your daily voltage. Now in Thunderberry. Do not exceed one per reality.", cta: "Feel the hum" },
  { bg: ["#0c0618", "#241040"], glow: "#8b5cf6", mark: "#2a1450", markColor: "#c4b5fd", glyph: "✦",
    h: "STARFORGE", sub: "Forge a fleet. Burn a galaxy. The hit space sim — season 3: The Ashen Armada is live.", cta: "Launch now" },
  { bg: ["#160800", "#3d1a00"], glow: "#f97316", mark: "#f97316", markColor: "#160800", glyph: "◮",
    h: "AeroStride Vapor 9", sub: "Carbon plate. Zero gravity energy return. Your knees will file a thank-you note.", cta: "Run faster" },
  { bg: ["#170e05", "#3a2410"], glow: "#b45309", mark: "#92400e", markColor: "#fde68a", glyph: "☕",
    h: "Dusk Roast", sub: "Single-origin beans roasted at twilight, for reasons that are mostly vibes.", cta: "Brew better" },
  { bg: ["#040d1a", "#0b2b4d"], glow: "#38bdf8", mark: "#38bdf8", markColor: "#040d1a", glyph: "◉",
    h: "FocusPilot", sub: "The app that closes your other apps. Ruthless productivity, delivered gently.", cta: "Get focused" },
  { bg: ["#020617", "#0f1f33"], glow: "#2dd4bf", mark: "#134e4a", markColor: "#99f6e4", glyph: "◐",
    h: "Night Harbor", sub: "A detective. A lighthouse. A town that remembers. Streaming exclusively on StreamPlus.", cta: "Watch ep. 1 free" },
  { bg: ["#12001f", "#2d0a4d"], glow: "#c084fc", mark: "#7e22ce", markColor: "#f3e8ff", glyph: "Q",
    h: "Quill Browser", sub: "Tabs that organize themselves. Tracking that doesn't exist. Browse like it's 2007 again.", cta: "Download Quill" },
  { bg: ["#060b02", "#16290a"], glow: "#a3e635", mark: "#365314", markColor: "#d9f99d", glyph: "N",
    h: "NovaCard", sub: "The card that rounds up your dreams. 2% cashback, 100% drip.", cta: "Apply in 60s" },
];
const params = new URLSearchParams(location.search);
let i = Number(params.get("i"));
if (!Number.isInteger(i) || i < 0 || i >= ADS.length) i = Math.floor(Math.random() * ADS.length);
const ad = ADS[i];
const s = document.getElementById("s");
s.style.background = `radial-gradient(120% 120% at 50% 0%, ${ad.bg[1]} 0%, ${ad.bg[0]} 70%)`;
const glow = document.getElementById("glow");
glow.style.background = `radial-gradient(50% 50% at 30% 30%, ${ad.glow}55, transparent 60%), radial-gradient(45% 45% at 75% 70%, ${ad.glow}33, transparent 60%)`;
const mark = document.getElementById("mark");
mark.style.background = ad.mark; mark.style.color = ad.markColor; mark.textContent = ad.glyph;
document.getElementById("h").textContent = ad.h;
document.getElementById("sub").textContent = ad.sub;
const cta = document.getElementById("cta");
cta.textContent = ad.cta; cta.style.boxShadow = `0 10px 30px ${ad.glow}66`;
const b = document.getElementById("b");
for (let k = 0; k < 14; k++) {
  const e = document.createElement("i");
  const sz = 4 + Math.random() * 10;
  e.style.cssText = `left:${Math.random() * 100}%;width:${sz}px;height:${sz}px;animation-duration:${5 + Math.random() * 7}s;animation-delay:${-Math.random() * 10}s;opacity:${.3 + Math.random() * .5}`;
  b.appendChild(e);
}
</script>
</body>
</html>
